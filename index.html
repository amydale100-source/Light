<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版手燈 - 青鳥飛越台灣 (RGB進階版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --current-color: #ffffff;
            --neon-blue: #0ea5e9; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            transition: background-color 0.8s ease;
            overflow: hidden;
            touch-action: manipulation; /* 優化手機觸控 */
        }

        @keyframes textBreath {
            0%, 100% { 
                text-shadow: 0 0 8px var(--neon-blue), 0 0 15px var(--neon-blue);
                opacity: 0.8;
            }
            50% { 
                text-shadow: 0 0 20px var(--neon-blue), 0 0 35px var(--neon-blue);
                opacity: 1;
            }
        }

        @keyframes birdFly {
            0% { transform: translate(-180px, 120px) rotate(10deg) scale(0.4); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translate(0px, 0px) rotate(0deg) scale(0.7); opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(180px, -120px) rotate(-10deg) scale(0.4); opacity: 0; }
        }

        @keyframes rgbFlow {
            0% { background-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { background-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { background-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { background-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        /* 七彩呼吸漸變動畫 */
        @keyframes rgbBreathMode {
            /* 使用 HSL 確保色彩柔和，飽和度設為 65%，亮度設為 80% */
            0%, 100% { background-color: hsl(0, 65%, 80%); box-shadow: 0 0 60px 10px hsl(0, 65%, 80%); }   /* 柔粉紅 */
            14.28% { background-color: hsl(45, 65%, 80%); box-shadow: 0 0 60px 10px hsl(45, 65%, 80%); }  /* 柔粉橘 */
            28.57% { background-color: hsl(90, 65%, 80%); box-shadow: 0 0 60px 10px hsl(90, 65%, 80%); }  /* 柔嫩綠 */
            42.85% { background-color: hsl(160, 65%, 80%); box-shadow: 0 0 60px 10px hsl(160, 65%, 80%); } /* 柔粉青 */
            57.14% { background-color: hsl(210, 65%, 80%); box-shadow: 0 0 60px 10px hsl(210, 65%, 80%); } /* 柔嫩藍 */
            71.42% { background-color: hsl(280, 65%, 80%); box-shadow: 0 0 60px 10px hsl(280, 65%, 80%); } /* 柔粉紫 */
            85.71% { background-color: hsl(330, 65%, 80%); box-shadow: 0 0 60px 10px hsl(330, 65%, 80%); } /* 柔粉棉 */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .light-glow {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 第一段：常亮模式 */
        .mode-static {
            background-color: var(--current-color) !important;
            box-shadow: 0 0 60px 10px var(--current-color);
        }

        /* 第二段：七彩呼吸模式 */
        .mode-rgb {
            animation: rgbBreathMode 8s linear infinite !important;
        }

        .taiwan-svg {
            width: 75%; height: 75%;
            transition: all 0.5s ease;
            z-index: 10;
        }
        
        .st0 { fill: #1e293b; transition: fill 0.5s ease; }
        .is-active .st0 { fill: #020617; }

        #statusText {
            transition: all 0.6s ease;
            color: #334155;
            font-size: 1.5rem;
        }

        .is-active #statusText {
            color: #bae6fd !important;
            animation: textBreath 2s ease-in-out infinite;
            z-index: 40;
            font-size: 1.75rem;
        }

        .bird-container {
            position: absolute;
            width: 100px; height: 100px;
            z-index: 30;
            pointer-events: none;
            display: none;
        }

        .is-active .bird-container {
            display: block;
            animation: birdFly 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .rgb-button-active {
            animation: rgbFlow 3s linear infinite;
        }

        .floating-container {
            animation: float 5s ease-in-out infinite;
        }

        .btn-neon:active { transform: scale(0.95); }
    </style>
</head>

        <div class="w-14 h-48 bg-gradient-to-b from-slate-700 via-slate-800 to-black rounded-b-[40px] shadow-2xl border-x border-slate-600 relative flex flex-col items-center">
            <div id="rgbButton" class="w-8 h-8 mt-10 rounded-full bg-slate-900 border-2 border-slate-600 shadow-inner transition-all duration-500"></div>

    <div class="mt-14 flex flex-col items-center gap-8">
        <button id="toggleBtn" class="btn-neon px-16 py-5 bg-white text-slate-900 font-black rounded-full text-xl uppercase tracking-widest transition-all">Power On</button>
        <div class="flex flex-col items-center gap-2 h-8">
            <p id="hintText" class="text-sky-400 text-[10px] tracking-[0.2em] opacity-0 transition-opacity uppercase text-center"></p>
        </div>
    </div>

    <script>
        const lightHead = document.getElementById('lightHead');
        const toggleBtn = document.getElementById('toggleBtn');
        const rgbButton = document.getElementById('rgbButton');
        const colorPicker = document.getElementById('colorPicker');
        const hintText = document.getElementById('hintText');
        
        // mode: 0 (Off), 1 (Static), 2 (RGB Flow)
        let mode = 0;

        function updateColor(hex) {
            document.documentElement.style.setProperty('--current-color', hex);
        }

        function cycleMode() {
            mode = (mode + 1) % 3;
            applyMode();
        }

        function applyMode() {
            lightHead.classList.remove('is-active', 'mode-static', 'mode-rgb');
            rgbButton.classList.remove('rgb-button-active');
            hintText.classList.add('opacity-0');

            if (mode === 0) {
                toggleBtn.innerText = 'Power On';
                toggleBtn.classList.replace('bg-slate-800', 'bg-white');
                toggleBtn.classList.replace('text-white', 'text-slate-900');
                hintText.innerText = '';
            } 
            else if (mode === 1) {
                lightHead.classList.add('is-active', 'mode-static');
                toggleBtn.innerText = 'Switch to RGB';
                toggleBtn.classList.replace('bg-white', 'bg-slate-800');
                toggleBtn.classList.replace('text-slate-900', 'text-white');
                rgbButton.classList.add('rgb-button-active');
                hintText.innerText = 'Tap RGB Button for custom color';
                hintText.classList.remove('opacity-0');
            } 
            else if (mode === 2) {
                lightHead.classList.add('is-active', 'mode-rgb');
                toggleBtn.innerText = 'Power Off';
                hintText.innerText = 'Pastel RGB Breathing Active';
                hintText.classList.remove('opacity-0');
                rgbButton.classList.remove('rgb-button-active');
            }
        }

        toggleBtn.addEventListener('click', e => { e.stopPropagation(); cycleMode(); });
        lightHead.addEventListener('click', cycleMode);
        rgbButton.addEventListener('click', (e) => {
            if (mode !== 1) return; // 只有在模式1（常亮）可以手動換色
            e.stopPropagation();
            colorPicker.click();
        });
        colorPicker.addEventListener('input', (e) => updateColor(e.target.value));
        
        updateColor('#ffffff');
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
